name: XiaoKe
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  XiaoKe:
    type: application
    platform: iOS
    sources:
      - path: XiaoKe
        excludes:
          - "*.txt"
      - path: ../assets          # 由 build_portal_assets.py 產生（tools.json + qr/）
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaoke
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP   # Yu-Juh Wu (Personal Team)；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaoKe/Info.plist
      properties:
        CFBundleDisplayName: 小柯
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: 小柯需要麥克風才能聽你說話。
        NSCameraUsageDescription: 工作站裡的網頁工具（例如 QR 掃描）需要使用相機。
        NSLocationWhenInUseUsageDescription: 工作站裡的網頁工具（例如 GPS 工具）需要使用定位。
        NSLocalNetworkUsageDescription: 用來提供同 Wi-Fi 的工具啟動頁，以及尋找電腦上的 Macro Deck。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
